id: bec-03-lookalike-fake-invoice
title: "Поддельный счёт от похожего домена поставщика"
scheme: false_invoice
target: buyer
based_on: "Facebook и Google, 2013–2015 — ~$122M, атакующий выдавал себя за Quanta Computer"
story: >
  Атакующий регистрирует northwind-supp1y.com (единица вместо l), копирует шаблон счёта и
  отправляет «очередной» инвойс с реквизитами в другой стране. Почту поставщика никто не взламывал.

attacker_controls: [lookalike_domain]
clean_channels: [phone_on_file, vendor_portal]
single_point_of_trust: "Счёт оплачивается на реквизиты, указанные в самом счёте, а не из справочника поставщиков"

events:
  - {t: "2026-11-17T10:20", type: email_received,    visible_to: [buyer], attrs: {from: invoices@northwind-supp1y.com, reply_to: ar.northwind@proton.me, lookalike_of: northwind-supply.com, domain_age_days: 6, urgency: medium, intent: payment_request, attachment: "INV-4512.pdf"}}
  - {t: "2026-11-17T11:02", type: beneficiary_added, visible_to: [buyer, bank], attrs: {account: "HK-0047-…", bank_country: HK, name_match: no_match, account_age_days: 33}}
  - {t: "2026-11-17T11:05", type: payment_created,   visible_to: [buyer, bank], attrs: {amount: 780000, currency: USD, new_beneficiary: true, amount_vs_median: 1.3, created_by: ap_clerk_1, channel: online_banking}}

signals_fired:
  - {signal: lookalike_domain}
  - {signal: young_sender_domain}
  - {signal: reply_to_mismatch}
  - {signal: payment_redirect_intent}
  - {signal: new_beneficiary}
  - {signal: new_beneficiary_country}
  - {signal: payee_name_mismatch}

expected:
  min_risk: critical
  action: block
  require: [callback_on_file]
  must_fire: [lookalike_domain, reply_to_mismatch, payee_name_mismatch]
  note: "Ловится уже на письме — до создания платежа"
catch_stage: email_received

devin_task: >
  Добавить в сервис приёма счетов сверку домена отправителя со справочником поставщиков
  (Левенштейн/гомоглифы/возраст домена) и запрет на оплату по реквизитам из PDF, если они
  не совпадают со справочником. Тест на эту карточку.
